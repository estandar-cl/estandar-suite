name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  syntax:
    name: PHP Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Check PHP syntax
        run: |
          find . -name "*.php" -not -path "./vendor/*" | while read f; do php -l "$f" || exit 1; done

  test:
    name: PHPUnit (Docker)
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install Composer deps
        run: composer install --no-interaction --prefer-dist

      - name: Start Docker
        run: docker compose up -d

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T db mysqladmin ping -h localhost -u wordpress -pwordpress 2>/dev/null && break
            sleep 2
          done

      - name: Wait for WordPress files
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T wordpress test -f /var/www/html/wp-load.php 2>/dev/null && break
            sleep 2
          done

      - name: Install WordPress
        run: |
          docker compose run --rm wpcli core install \
            --url=http://localhost:18080 \
            --title="ECB Test" \
            --admin_user=admin \
            --admin_password=admin123 \
            --admin_email=admin@example.com \
            --skip-email
      - name: Activate plugin
        run: docker compose exec -T wordpress wp plugin activate estandar-chatbot --allow-root

      - name: Run PHPUnit
        run: |
          docker compose exec -T wordpress bash -c \
            'cd /var/www/html/wp-content/plugins/estandar-chatbot && WP_LOAD_PATH=/var/www/html php vendor/bin/phpunit'
